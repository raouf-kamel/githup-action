name: Auto Version Bump

on:
  push:
    branches:
      - main
      - development

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Version Name
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # اقرأ VERSION_MAJOR و VERSION_MINOR من gradle.properties
          VERSION_MAJOR=$(grep '^VERSION_MAJOR' gradle.properties | cut -d'=' -f2 | xargs || true)
          VERSION_MINOR=$(grep '^VERSION_MINOR' gradle.properties | cut -d'=' -f2 | xargs || true)

          VERSION_MAJOR=${VERSION_MAJOR:-0}
          VERSION_MINOR=${VERSION_MINOR:-0}

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          LAST_TAG=${LAST_TAG#v}
          LAST_TAG=${LAST_TAG#V}

          LAST_MAJOR=$(echo "$LAST_TAG" | cut -d'.' -f1)
          LAST_MINOR=$(echo "$LAST_TAG" | cut -d'.' -f2)
          LAST_PATCH=$(echo "$LAST_TAG" | cut -d'.' -f3)

          LAST_MAJOR=${LAST_MAJOR:-0}
          LAST_MINOR=${LAST_MINOR:-0}
          LAST_PATCH=${LAST_PATCH:-0}

          if [[ "$VERSION_MAJOR" != "$LAST_MAJOR" || "$VERSION_MINOR" != "$LAST_MINOR" ]]; then
            PATCH=1
          else
            PATCH=$((LAST_PATCH + 1))
          fi

          APK_VERSION=${VERSION_MAJOR}.${VERSION_MINOR}.${PATCH}

          echo "Determined version: $APK_VERSION (last tag: $LAST_TAG, patch: $PATCH)"
          echo "patch=$PATCH" >> $GITHUB_OUTPUT
          echo "versionName=$APK_VERSION" >> $GITHUB_OUTPUT

      - name: Version Bump
        uses: chkfung/android-version-actions@v1.2.3
        with:
          gradlePath: app/build.gradle.kts
          versionCode: ${{ github.run_number }}
          versionName: ${{ steps.version.outputs.versionName }}