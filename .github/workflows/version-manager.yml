name: Auto Version Bump

on:
  push:
    branches:
      - main
      - development

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_PROPERTIES="gradle.properties"
          GRADLE_FILE="app/build.gradle.kts"

          # Read declared major/minor
          VERSION_MAJOR=$(grep '^VERSION_MAJOR' "$GRADLE_PROPERTIES" | cut -d'=' -f2 | xargs || echo 0)
          VERSION_MINOR=$(grep '^VERSION_MINOR' "$GRADLE_PROPERTIES" | cut -d'=' -f2 | xargs || echo 0)

          # Read current versionName or fallback to last Git tag
          CURRENT_VERSION=$(grep -Eo 'versionName\s*=\s*"[0-9]+\.[0-9]+\.[0-9]+"' "$GRADLE_FILE" | head -n1 || git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          CURRENT_VERSION=${CURRENT_VERSION//versionName=/}
          CURRENT_VERSION=${CURRENT_VERSION//\"/}

          CUR_MAJOR=$(echo "$CURRENT_VERSION" | cut -d'.' -f1)
          CUR_MINOR=$(echo "$CURRENT_VERSION" | cut -d'.' -f2)
          CUR_PATCH=$(echo "$CURRENT_VERSION" | cut -d'.' -f3)

          # Determine patch
          if [[ "$VERSION_MAJOR" != "$CUR_MAJOR" || "$VERSION_MINOR" != "$CUR_MINOR" ]]; then
            PATCH=1
          else
            PATCH=$((CUR_PATCH + 1))
          fi

          APK_VERSION=${VERSION_MAJOR}.${VERSION_MINOR}.${PATCH}

          echo "versionName=$APK_VERSION" >> $GITHUB_OUTPUT
          echo "patch=$PATCH" >> $GITHUB_OUTPUT

      - name: Apply Version Bump
        uses: chkfung/android-version-actions@v1.2.3
        with:
          gradlePath: app/build.gradle.kts
          versionCode: ${{ github.run_number }}
          versionName: ${{ steps.version.outputs.versionName }}

      - name: Commit & Push Changes
        if: always()
        env:
          VERSION_NAME: ${{ steps.version.outputs.versionName }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="${GITHUB_REF#refs/heads/}"
          git add app/build.gradle.kts gradle.properties || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to ${VERSION_NAME} (code ${GITHUB_RUN_NUMBER})"
            git push origin "HEAD:${BRANCH}"
          else
            echo "No changes to commit"
          fi
