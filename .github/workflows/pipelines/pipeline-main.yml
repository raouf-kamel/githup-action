name: Main Pipeline

on:
  push:
    branches: [ main ]

jobs:
  version:
    uses: ./.github/workflows/versioning/auto-version.yml

  build:
    uses: ./.github/workflows/build/build-release.yml
    needs: version
    with:
      type: aab

  sign:
    uses: ./.github/workflows/signing/sign-artifact.yml
    needs: build
    with:
      inputPath: ${{ needs.build.outputs.ARTIFACT_PATH }}

  deploy:
    uses: ./.github/workflows/deploy/deploy-google-play.yml
    needs: sign
    with:
      file: ${{ needs.sign.outputs.SIGNED_PATH }}
