name: Deploy Google Play

on:
  workflow_call:
    inputs:
      file:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Auth Google Play
        run: echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > sa.json

      - uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJson: sa.json
          packageName: com.raouf_developer.navigation
          releaseFiles: ${{ inputs.file }}
          track: internal
          status: completed
